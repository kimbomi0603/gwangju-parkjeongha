<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>약속 점검 | 박정하 · 광주 북구의회의원(나선거구)</title>
<meta property="og:image" content="https://xn--hc0bu8zl5im0ac66b.kr/assets/img/og.jpg">
<meta property="og:url" content="https://xn--hc0bu8zl5im0ac66b.kr/pledges.html">
<meta name="description" content="박정하 광주 북구의회의원이 문흥·오치·우산동 주민께 드린 약속과, 약속별로 연결된 의정활동을 공개합니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="pledges">
<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <span class="section-tag on-dark">약속 점검</span>
    <h1>주민께 드린 약속,<br><span class="hl">임기 내내 공개합니다</span></h1>
    <p>선거 때 드린 동별 약속을 그대로 두고, 관련 의정활동이 생길 때마다 약속 옆에 기록합니다. 임기는 2026년 7월부터 2030년 6월까지입니다.</p>
    <div class="ph-stats" id="p-stats"></div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="legend">
      <span><i class="st st-on"></i>관련 의정활동 있음</span>
      <span><i class="st"></i>임기 중 추진 과제</span>
    </div>
    <div class="pledge-tabs" id="tabs"></div>
    <div id="panels"></div>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="cta-banner">
      <h2>약속에 없는 우리 동네 문제도 알려주세요</h2>
      <p>주민이 보내준 제안은 확인해서 의정활동으로 이어갑니다. 메일로 바로 전달됩니다.</p>
      <a href="propose.html" class="btn btn-gold btn-lg" style="margin-top:6px">민원·정책 제안하기</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const anchors = ["문흥","오치","우산"];
  const all = PLEDGES.flatMap(p => p.groups.flatMap(g => g.items));
  const linked = all.filter(t => PLEDGE_LINKS[t]).length;
  document.getElementById("p-stats").innerHTML =
    '<div><b>3곳</b><span>동별 약속</span></div>' +
    '<div><b>' + all.length + '개</b><span>약속 항목</span></div>' +
    '<div><b>' + linked + '건</b><span>관련 의정활동</span></div>' +
    '<div><b>2030.6</b><span>임기 만료</span></div>';

  const tabs = document.getElementById("tabs");
  const panels = document.getElementById("panels");
  tabs.innerHTML = PLEDGES.map((p,i)=>`<button data-i="${i}">${p.dong}</button>`).join("");
  panels.innerHTML = PLEDGES.map((p,i)=>`
    <div class="pledge-panel" id="${anchors[i]}" data-i="${i}">
      <div class="pledge-head">
        <span class="dong">${p.dong} 약속</span>
        <h3>${esc(p.head)}</h3>
      </div>
      ${p.groups.map(g=>`
        <div class="pledge-item">
          <h4><span class="badge">${g.tag}</span>${esc(g.title)}</h4>
          <ul class="pledge-check">${g.items.map(it=>{
            const L = PLEDGE_LINKS[it];
            return L
              ? `<li class="on"><i class="st st-on"></i><div><b>${esc(it)}</b><a class="pl-link" href="activity.html#t-${L.d}">${L.d.replace(/-/g,".")} · ${esc(L.note)} →</a></div></li>`
              : `<li><i class="st"></i><div>${esc(it)}<span class="pl-todo">임기 중 추진</span></div></li>`;
          }).join("")}</ul>
        </div>`).join("")}
    </div>`).join("");

  const tabBtns = [...tabs.querySelectorAll("button")];
  const panelEls = [...panels.querySelectorAll(".pledge-panel")];
  function show(i){
    tabBtns.forEach((b,k)=>b.classList.toggle("active",k===i));
    panelEls.forEach((p,k)=>p.classList.toggle("active",k===i));
  }
  tabBtns.forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.i; show(i);
    history.replaceState(null,"","#"+anchors[i]);
  }));
  const h=decodeURIComponent(location.hash.replace("#",""));
  show(Math.max(0,anchors.indexOf(h)));
})();
</script>
</body>
</html>
